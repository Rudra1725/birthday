<style>

.smoke{opacity:0;transform-box:fill-box;transform-origin:center}

.out .smoke:nth-of-type(2){animation-delay:.35s}.out .smoke:nth-of-type(3){animation-delay:.7s}

.hd>*{grid-area:1/1;display:flex;align-items:center;justify-content:center;transition:opacity .85s}

@keyframes pop{40%{transform:scale(1.18)}100%{transform:scale(1.5);opacity:0;visibility:hidden}}

.list{width:100%;display:flex;flex-direction:column;gap:10px}

.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item .on{display:none}
.item.open{background:linear-gradient(145deg,rgba(232,200,143,.2),rgba(235,163,182,.1));border-color:rgba(232,200,143,.7);cursor:default}

.item.cp{border-style:dashed;border-width:1.5px}

.sky svg{width:100%;height:100%;display:block}
.st{cursor:pointer}

.hl{fill:none;stroke:#ffd9a0;stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400}

.hf{fill:#eba3b6;opacity:0;transition:opacity 2s 1.6s}.sky.done .hf{opacity:.28}

.swap>*{grid-area:1/1;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
.swap .b{opacity:0}.swap.on .a{opacity:0}.swap.on .b{opacity:1}

.env .paper{position:absolute;left:12px;right:12px;top:12px;bottom:12px;background:#fbf3e6;border-radius:5px;transition:transform .8s .35s cubic-bezier(.3,.8,.3,1)}
.env.open .paper{transform:translateY(-52px)}
.env svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(#7a2c5c,#52193f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s cubic-bezier(.4,.1,.2,1),z-index 0s .35s;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .seal{position:absolute;left:50%;top:calc(56% - 22px);transform:translateX(-50%);z-index:5;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35%,#f7e2b8,#d4a25a);display:grid;place-items:center;color:#7a1f48;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.45);transition:opacity .35s}

.lcard{display:none;position:relative;width:100%;max-width:370px;margin-top:14px;background:#fbf3e6;border-radius:14px;padding:30px 14px 10px;box-shadow:0 24px 50px -14px rgba(0,0,0,.7);animation:enter .8s both}

.lp{font:600 clamp(21px,5.8vw,24px)/30px Caveat,cursive;color:#5a2a45;text-align:left;white-space:pre-wrap;overflow-y:auto;max-height:min(calc(var(--u)*44),380px);padding:2px 8px;background:repeating-linear-gradient(transparent 0 29px,#ecd9c4 29px 30px);background-attachment:local;overflow-wrap:anywhere}
.gift{width:min(180px,52vw,calc(var(--u)*26));height:auto;cursor:pointer;animation:gs 2.4s ease-in-out infinite;overflow:visible}

.final{width:100%;max-width:370px;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:enter .9s both}

.wa{display:flex;gap:8px;justify-content:center}
.shoot{position:absolute;top:14px;left:-40px;font-size:20px;pointer-events:none;animation:sh2 1.35s cubic-bezier(.2,.8,.2,1) forwards}

#dots{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:10;pointer-events:none}

.pi{display:flex;gap:6px;align-items:center}.pi img{width:38px;height:38px;object-fit:cover;border-radius:6px}.pi input{flex:1}
.pi button{background:rgba(255,255,255,.1);border:0;color:var(--gold);border-radius:8px;width:30px;height:32px;cursor:pointer}
.mf{padding:12px 20px;border-top:1px solid rgba(232,200,143,.2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

H=[];for(let k=0;k<10;k++)H.push(hp(k*Math.PI/5));
const O=[];for(let j=0;j<120;j++)O.push(hp(j*Math.PI/60));
const path='M'+O.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z',bgs=[];
for(let tr=0;tr<900&&bgs.length<34;tr++){const x=Math.random()*300,y=Math.random()*260;
if(H.some(p=>Math.hypot(p[0]-x,p[1]-y)<32)||O.some(p=>Math.hypot(p[0]-x,p[1]-y)<12)||bgs.some(p=>Math.hypot(p[0]-x,p[1]-y)<17))continue;bgs.push([x,y])}
const bg=bgs.map(p=>`<circle class="tw" style="animation-delay:-${(Math.random()*3).toFixed(1)}s" cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="${(Math.random()+.5).toFixed(1)}" fill="#fff"/>`).join('');
const star=H.map((p,i)=>{const[x,y]=p.map(v=>v.toFixed(1));return `<g class="st" data-i="${i}"><circle class="glow" cx="${x}" cy="${y}" r="17" fill="#ffd27a" opacity=".35"/><path class="core" d="M${x} ${y-9}L${+x+2.7} ${y-2.7}L${+x+9} ${y}L${+x+2.7} ${+y+2.7}L${x} ${+y+9}L${x-2.7} ${+y+2.7}L${x-9} ${y}L${x-2.7} ${y-2.7}Z" fill="#8f86c4"/><circle cx="${x}" cy="${y}" r="22" fill="transparent"/></g>`}).join('');
box.innerHTML=`<h2>Wish upon a star</h2><div class="sky" id="sky"><svg viewBox="0 0 300 260"><defs><linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150f3e"/><stop offset="1" stop-color="#4a2368"/></linearGradient></defs><rect width="300" height="260" fill="url(#nt)"/>${bg}<path class="hf" d="${path}"/><path class="hl" d="${path}"/>${star}</svg></div><div class="swap" id="sw"><p class="sub a" id="cnt">Tap every star · 0 / 10</p><p class="nm b" style="font-size:clamp(34px,10vw,44px)">Every star is a wish for you</p></div>${btn('nx','Continue')}`;
let n=0;$$('.st',box).forEach(s=>s.addEventListener('click',()=>{if(s.classList.contains('lit'))return;s.classList.add('lit');S.star(n);$('#cnt',box).textContent='Tap every star · '+ ++n+' / 10';
if(n===10){T(()=>{S.chord();$('#sky',box).classList.add('done');$('#sw',box).classList.add('on')},450);T(()=>$('#nx',box).classList.add('on'),2400)}}));$('#nx',box).onclick=next}

/* ---------- 10: LETTER ---------- */
function st10(box){box.innerHTML=`<h2>A message from my heart</h2><div class="env" id="env"><div class="back"></div><div class="paper"></div><svg viewBox="0 0 300 190" preserveAspectRatio="none"><path d="M2 188L150 96L298 188" stroke="#e8c88f" stroke-width="1.5" fill="none" opacity=".7"/></svg><div class="flap"></div><div class="seal">♥</div></div><p class="sub" id="hint">Tap the envelope</p><div class="lcard" id="lc"><div class="badge">♥</div><div class="lp" id="txt"></div></div>${btn('nx','Continue')}`;
let opened=false,full='',idx=0,tm=null;const txt=$('#txt',box),nx=$('#nx',box);
const fin=()=>{clearInterval(tm);idx=full.length;txt.textContent=full;nx.classList.add('on')};
$('#env',box).onclick=function(){if(opened)return;opened=true;S.env();this.classList.add('open');$('#hint',box).style.opacity=0;const env=this;
T(()=>{env.classList.add('gone');$('#hint',box).remove();$('#lc',box).classList.add('show');full='Dear '+NM()+',\n\n'+CFG.letterBody.replace(/\{name\}/g,NM());txt.textContent='';tm=I(()=>{if(idx<full.length){const ch=full.charAt(idx);txt.textContent=full.slice(0,++idx);if(idx%3===0&&ch.trim())S.tick();txt.scrollTop=txt.scrollHeight}else fin()},30)},1350)};
txt.onclick=()=>{if(idx<full.length)fin()};nx.onclick=()=>{clearInterval(tm);next()}}

/* ---------- 11: FINALE ---------- */
function st11(box){box.innerHTML=`<h2>One last thing</h2><p class="sub">Tap the gift</p><svg class="gift" id="gift" viewBox="0 0 160 170"><g fill="rgba(232,200,143,.08)" stroke="#e8c88f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="24" y="76" width="112" height="82" rx="8"/><rect x="14" y="52" width="132" height="28" rx="8"/><path d="M72 52V158M88 52V158" fill="none"/><path d="M80 52C56 24 34 30 42 44 48 54 70 52 80 52zM80 52C104 24 126 30 118 44 112 54 90 52 80 52z" fill="rgba(235,163,182,.2)"/></g><path class="tw" d="M18 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f7e2b8"/><path class="tw" style="animation-delay:-1s" d="M138 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f7e2b8"/></svg>`;
$('#gift',box).onclick=()=>{S.fin();confetti();
box.innerHTML=`<div class="final glass">${ORN}<p class="big">With all my love</p><p class="q">Happy Birthday, <span style="color:var(--gold)">${esc(NM())}</span>.</p><p class="sub">I hope this made you smile.</p><div class="wb" id="wb"><label for="wi">What did you wish for?</label><input type="text" id="wi" maxlength="140" placeholder="Write your wish here..."><div class="wa"><button class="btn sm" id="ws">Seal my wish</button><button class="btn ghost sm" id="wk">Keep it secret</button></div></div></div><div class="slot"><button class="btn ghost sm" id="rp">Replay</button></div>`;
const wb=$('#wb',box),seal=sec=>{const v=($('#wi',box).value||'').trim();S.chord();const s=document.createElement('span');s.className='shoot';s.textContent='🌠';wb.appendChild(s);setTimeout(()=>s.remove(),1400);
wb.innerHTML=`<p class="hand" style="font-size:26px;color:var(--gold);line-height:1.2">${sec||!v?'Sealed among the stars. May your secret wish come true.':'Sent to the universe: “'+esc(v)+'”'}</p>`};
$('#ws',box).onclick=()=>seal(0);$('#wk',box).onclick=()=>seal(1);$('#rp',box).onclick=()=>{S.tap();go(0)}}}
const STAGES=[st1,st2,st3,st4,st5,st6,st7,st8,st9,st10,st11];

/* ---------- CONFETTI ---------- */
function confetti(){const cv=$('#conf'),x=cv.getContext('2d'),d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
const cols=['#f7e2b8','#e8c88f','#eba3b6','#fff','#c9a0e8','#f4c4d4'],ps=[];
const burst=(ox,oy,n,sp)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.35+Math.random()*.65)*sp;ps.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,c:cols[i%6],w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:Math.random()*.4-.2,k:Math.random()<.2?1:Math.random()<.3?2:0})}};
burst(W/2,H*.5,160,14);setTimeout(()=>{burst(W*.15,H*.9,60,15);burst(W*.85,H*.9,60,15)},350);let f=0;
(function dr(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.26;p.vx*=.992;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.k===1){x.font='15px serif';x.fillText('♥',-6,6)}else if(p.k===2){x.beginPath();x.arc(0,0,p.h/1.4,0,6.3);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<320)requestAnimationFrame(dr);else x.clearRect(0,0,W,H)})()}

/* ---------- ADMIN: triple-tap the faint heart (top right) ---------- */
let clicks=[],draft;
$('#adm').onclick=()=>{const n=Date.now();clicks=clicks.filter(t=>n-t<1200);clicks.push(n);if(clicks.length>=3){clicks=[];skip.classList.remove('on');draft=JSON.parse(JSON.stringify(CFG));draw();$('#modal').classList.add('on')}};
const getp=(o,k)=>k.split('.').reduce((a,b)=>a[b],o),setp=(o,k,v)=>{const a=k.split('.'),l=a.pop();a.reduce((x,y)=>x[y],o)[l]=v};
const inp=(k,l,tag)=>`<label>${l}</label>`+(tag?`<textarea data-k="${k}">${esc(getp(draft,k))}</textarea>`:`<input type="text" data-k="${k}" value="${esc(getp(draft,k))}">`);
function sync(){$$('[data-k]').forEach(e=>setp(draft,e.dataset.k,e.value))}
function draw(msg){const m=$('#modal');const _o=m.querySelector('.mb'),_sy=_o?_o.scrollTop:0;
m.innerHTML=`<div class="mbox"><div class="mh">Customize the surprise</div><div class="mb">${inp('name','Name')}${inp('welcomeSubtitle','Welcome question')}${[0,1,2,3].map(i=>inp('balloonWords.'+i,'Balloon word '+(i+1))).join('')}${[0,1,2,3,4].map(i=>inp('reasons.'+i,'Reason '+(i+1))).join('')}${[0,1,2].map(i=>inp('coupons.'+i,'Coupon '+(i+1))).join('')}${inp('letterBody','Letter (after "Dear NAME,")',1)}<label>Photos (${draft.photos.length} / 10)</label>${draft.photos.map((p,i)=>`<div class="pi"><img src="${esc(p.src)}" alt="" data-r="${i}" title="Tap to replace photo" style="cursor:pointer"><input type="text" data-k="photos.${i}.caption" value="${esc(p.caption)}" placeholder="Caption"><button data-r="${i}" title="Replace photo">✎</button><button data-u="${i}">↑</button><button data-d="${i}">↓</button><button data-x="${i}">✕</button></div>`).join('')}<input type="file" id="af" accept="image/*" multiple><input type="file" id="rf" accept="image/*" style="display:none"></div><div id="am">${esc(msg||'Photos are compressed automatically.')}</div><div class="mf"><button class="btn" id="as">Save &amp; preview</button><button class="btn ghost" id="ar">Reset</button><button class="btn ghost" id="ad">Download html</button><button class="btn ghost" id="ax">Close</button></div></div>`;
$('#af').onchange=e=>{sync();const files=[...e.target.files],room=10-draft.photos.length;if(room<=0){draw('Photo limit reached (10).');return}
files.slice(0,room).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);draft.photos.push({src:cv.toDataURL('image/jpeg',.78),caption:''});sync();draw()};im.src=r.result};r.readAsDataURL(f)})};
const mv=(a,b)=>{sync();if(b>=0&&b<draft.photos.length){const t=draft.photos[a];draft.photos[a]=draft.photos[b];draft.photos[b]=t}draw()};
$$('[data-u]',m).forEach(b=>b.onclick=()=>mv(+b.dataset.u,+b.dataset.u-1));$$('[data-d]',m).forEach(b=>b.onclick=()=>mv(+b.dataset.d,+b.dataset.d+1));
$$('[data-x]',m).forEach(b=>b.onclick=()=>{sync();if(draft.photos.length>1){draft.photos.splice(+b.dataset.x,1);draw()}else draw('Keep at least one photo.')});
let rIdx=-1;const rf=$('#rf');
$$('[data-r]',m).forEach(b=>b.onclick=()=>{rIdx=+b.dataset.r;rf.value='';rf.click()});
rf.onchange=e=>{const f=e.target.files[0];if(!f||rIdx<0)return;sync();const at=rIdx;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);draft.photos[at].src=cv.toDataURL('image/jpeg',.78);draw('Photo replaced (caption kept).')};im.src=r.result};r.readAsDataURL(f)};
const _nb=$('.mb',m);if(_nb)_nb.scrollTop=_sy;
$('#ax').onclick=()=>m.classList.remove('on');
$('#as').onclick=()=>{sync();draft._t=Date.now();CFG=norm(draft);try{localStorage.setItem(KEY,JSON.stringify(CFG))}catch(e){}m.classList.remove('on');busy=false;cur=-1;go(0)};
$('#ar').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}draft=JSON.parse(JSON.stringify(DEFAULT));draw('Reset to default (not saved yet).')};
$('#ad').onclick=()=>{sync();draft._t=Date.now();exportHtml(norm(draft))}}
function exportHtml(cfg){const el=document.documentElement.cloneNode(true);el.querySelector('#root').innerHTML='';[...el.querySelectorAll('html,body,#root')].forEach(e=>e.removeAttribute('style'));el.removeAttribute('style');
el.querySelector('#cfg').textContent='window.BAKED='+JSON.stringify(cfg).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')+';';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+el.outerHTML],{type:'text/html;charset=utf-8'}));a.download='index.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);const m=$('#am');if(m)m.textContent='Downloaded index.html with your edits and photos baked in.'}
go(0)})();
</script>
